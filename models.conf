[allocation]
gpus_per_node = 3          # deve corrispondere alle GPU/nodo che allocherai

[defaults]
parallel      = 1
kv_cache_type = "f16"
reasoning     = "auto"

[[model]]
label             = "assistant"
hf_repo           = "unsloth/Llama-4-Scout-17B-16E-Instruct-GGUF"
gguf_file         = "Q4_K_M/Llama-4-Scout-17B-16E-Instruct-Q4_K_M-00001-of-00002.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 8192

[[model]]
label             = "llama33"
hf_repo           = "lmstudio-community/Llama-3.3-70B-Instruct-GGUF"
gguf_file         = "Llama-3.3-70B-Instruct-Q4_K_M.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 8192

[[model]]
label             = "oss120"
hf_repo           = "unsloth/gpt-oss-120b-GGUF"
gguf_file         = "Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 8192
reasoning         = "on"      # thinking model → emit/separate the reasoning trace
reasoning_format  = "auto"    # gpt-oss uses harmony channels, not <think>: let llama.cpp
                              # auto-detect so 'content' = final answer (deepseek can't parse it)

[[model]]
label             = "deepseek70"
# ⚠️ VERIFY hf_repo/gguf_file: the name you gave (deepseek-ai/DeepSeek-R1-Distill-Llama-70B)
# is the base (safetensors) repo, NOT GGUF. Below is a GGUF mirror — confirm the exact
# split file name on the HF Files tab or via: python -m cerberus.estimator <repo> -q Q4_K_M
hf_repo           = "unsloth/DeepSeek-R1-Distill-Llama-70B-GGUF"
gguf_file         = "DeepSeek-R1-Distill-Llama-70B-Q4_K_M/DeepSeek-R1-Distill-Llama-70B-Q4_K_M-00001-of-00002.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 8192
reasoning         = "on"      # DeepSeek-R1 emits <think>…</think> → deepseek format (default) is correct

[[model]]
label             = "qwen72"
# ⚠️ VERIFY gguf_file name (Qwen ships split GGUFs; confirm on HF Files tab).
hf_repo           = "Qwen/Qwen2.5-72B-Instruct-GGUF"
gguf_file         = "qwen2.5-72b-instruct-q4_k_m-00001-of-00002.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 8192
