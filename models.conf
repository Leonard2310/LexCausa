[allocation]
gpus_per_node = 3          # deve corrispondere alle GPU/nodo che allocherai

[defaults]
parallel      = 1
kv_cache_type = "f16"
reasoning     = "auto"

[[model]]
label             = "assistant"
hf_repo           = "unsloth/Llama-4-Scout-17B-16E-Instruct-GGUF"
gguf_file         = "Q4_K_M/Llama-4-Scout-17B-16E-Instruct-Q4_K_M-00001-of-00002.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 20000

[[model]]
label             = "llama33"
hf_repo           = "lmstudio-community/Llama-3.3-70B-Instruct-GGUF"
gguf_file         = "Llama-3.3-70B-Instruct-Q4_K_M.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 20000

[[model]]
label             = "oss120"
hf_repo           = "unsloth/gpt-oss-120b-GGUF"
gguf_file         = "Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 20000
reasoning         = "on"      # thinking model → emit/separate the reasoning trace
reasoning_format  = "auto"    # gpt-oss uses harmony channels, not <think>: let llama.cpp
                              # auto-detect so 'content' = final answer (deepseek can't parse it)

[[model]]
label             = "glmz1"
hf_repo           = "unsloth/GLM-Z1-32B-0414-GGUF"
gguf_file         = "GLM-Z1-32B-0414-Q4_K_M.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 20000
reasoning         = "on"      # GLM-Z1 documented as emitting <think>…</think> like DeepSeek-R1 —
                               # NOT yet verified against llama.cpp's parser here; confirm with a
                               # test call before trusting 'content' (see test_glm/ validation).

[[model]]
label             = "qwen72"
hf_repo           = "Qwen/Qwen2.5-72B-Instruct-GGUF"
gguf_file         = "qwen2.5-72b-instruct-q4_k_m-00001-of-00012.gguf"
alloc_mode        = "AUTO"
max_input_tokens  = 20000
max_output_tokens = 20000
