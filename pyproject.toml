[project]
name = "lex-causa"
version = "0.1.0"
description = ""
authors = [
    {name = "Leonardo Catello",email = "leonardo.catello@hotmail.com"}
]
packages = [{ include = "src" }]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.120.4,<0.121.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "neo4j (>=5.0.0,<6.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "pyarrow (>=15.0.0,<16.0.0)",
    "datasets (>=2.0.0,<3.0.0)",
    "huggingface-hub (>=0.20.0,<1.0.0)",
    "dask[dataframe] (>=2024.0.0)",
    "groq (>=1.0.0,<2.0.0)",
    "numpy (>=1.24.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)"
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "notebooks/",
    "tests/",
]

[[tool.mypy.overrides]]
module = ["src.services.*", "src.db.*"]
ignore_errors = true
